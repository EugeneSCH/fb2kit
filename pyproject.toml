[project]
name = "fb2kit"
version = "0.1.0"
description = "Typed, immutable FictionBook (FB2) parser with strict and tolerant modes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Евгений Щербинин", email = "e.shherbinin@ideco.ru" }
]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.optional-dependencies]
fast = ["lxml>=6.1.3"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3",
    "mkdocs-material>=9",
    "mkdocstrings[python]>=0.25",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["corpus: run over the local corpus FB2KIT_CORPUS"]
addopts = "-m 'not corpus'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Long inline XML in tests.
"tests/*" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.coverage.run]
source = ["fb2kit"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
